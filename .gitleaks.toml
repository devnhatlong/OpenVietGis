[extend]
useDefault = true

[allowlist]
description = "Generated or vendored content is outside the versioned source surface"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)graphify-out/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)coverage/''',
  '''(^|/)test-results/''',
  '''(^|/)playwright-report/'''
]
