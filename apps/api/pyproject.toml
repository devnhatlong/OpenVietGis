[project]
name = "openvietgis-api"
version = "0.0.0"
description = "OpenVietGIS application API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.120",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.10",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.38"
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.18",
  "pytest>=8.4",
  "pyyaml>=6.0",
  "ruff>=0.14"
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openvietgis_api"]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["../.."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["migrations/"]
