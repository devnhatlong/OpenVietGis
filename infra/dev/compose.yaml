services:
  postgres:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_DB: openvietgis
      POSTGRES_USER: openvietgis
      POSTGRES_PASSWORD: openvietgis
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U openvietgis -d openvietgis"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - openvietgis_pgdata:/var/lib/postgresql
      - ./postgres/001-runtime-role.sql:/docker-entrypoint-initdb.d/001-runtime-role.sql:ro

  postgres-test:
    # R003 approved control runtime; CI records the observed image too.
    image: postgis/postgis@sha256:fe440a27c6567aefa932e988962e5827bb2c29e4b97dac2ca5268f5eafe10262
    environment:
      POSTGRES_DB: openvietgis_test
      POSTGRES_USER: openvietgis
      POSTGRES_PASSWORD: openvietgis
    ports:
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U openvietgis -d openvietgis_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - openvietgis_test_pgdata:/var/lib/postgresql
      - ./postgres/001-runtime-role.sql:/docker-entrypoint-initdb.d/001-runtime-role.sql:ro

volumes:
  openvietgis_test_pgdata:
  openvietgis_pgdata:
