services:
  postgres:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_DB: openvietgis
      POSTGRES_USER: openvietgis
      POSTGRES_PASSWORD: openvietgis
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvietgis -d openvietgis"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - openvietgis_pgdata:/var/lib/postgresql
      - ./postgres/001-runtime-role.sql:/docker-entrypoint-initdb.d/001-runtime-role.sql:ro

volumes:
  openvietgis_pgdata: