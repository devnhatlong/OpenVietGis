name: CI

on:
  push:
    branches: [main, "001-platform-foundation"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      OPENVIETGIS_ENVIRONMENT: test
      OPENVIETGIS_DATABASE_URL: postgresql+psycopg://openvietgis:openvietgis@127.0.0.1:5432/openvietgis

    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_DB: openvietgis
          POSTGRES_USER: openvietgis
          POSTGRES_PASSWORD: openvietgis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openvietgis -d openvietgis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "12.21.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --project apps/api --frozen

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Validate foundation
        run: pnpm validate

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
